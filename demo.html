<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Зоряний рік 2027 — демо гри</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#0E1330;--card:rgba(23,29,69,.78);--line:rgba(185,180,255,.25);--gold:#FFD66B;--gold2:#F29A2E;--pale:#FFE7A3;--txt:#F4F1EA;--mut:#C9CCE0;--dim:#A9AEC9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky svg{width:100%;height:100%}
.tw{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,244,214,.8);animation:twinkle 3s ease-in-out infinite}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 18px 104px}
h1,h2,h3{font-family:Unbounded,sans-serif;margin:0}
h1{font-size:24px;font-weight:800;color:var(--pale)}
h2{font-size:20px;font-weight:700;color:var(--pale)}
p{margin:0;line-height:1.5}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#DCD9FF}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:18px;border:none;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1A1230;font-family:Unbounded,sans-serif;font-size:16px;font-weight:700;cursor:pointer;width:100%;padding:0 18px;text-decoration:none}
.btn.ghost{background:rgba(23,29,69,.6);border:1.5px solid #8F87F5;color:#DCD9FF;font-family:Manrope,sans-serif;font-size:15px}
.btn:disabled{opacity:.45}
input,textarea{width:100%;font-family:Manrope,sans-serif;font-size:16px;color:var(--txt);background:rgba(14,19,48,.7);border:1.5px solid var(--line);border-radius:14px;padding:14px;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
label{font-size:14px;font-weight:700;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(23,29,69,.85);border:1.5px solid rgba(255,214,107,.4);border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;color:var(--gold)}
.bar{height:10px;border-radius:6px;background:rgba(37,43,92,.85);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px;transition:width .6s}
.quest{display:flex;align-items:center;gap:14px;min-height:78px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);font-family:Manrope,sans-serif;text-align:left;padding:12px 16px;cursor:pointer;width:100%}
.quest.done{border-color:rgba(255,214,107,.6);background:rgba(255,214,107,.13)}
.qdot{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:2px dashed currentColor;display:flex;align-items:center;justify-content:center}
.quest.done .qdot{border:none;background:radial-gradient(circle at 40% 40%,#FFFBEA,var(--gold) 55%,var(--gold2));box-shadow:0 0 16px rgba(255,201,77,.75);animation:pop .45s ease-out}
.qb{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.qt{font-size:15px;font-weight:600;line-height:1.35}
.qp{flex-shrink:0;font-size:15px;font-weight:800;color:var(--gold)}
.energy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.energy button{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:132px;border-radius:20px;border:1.5px solid rgba(185,180,255,.3);background:var(--card);color:var(--txt);font-family:Manrope,sans-serif;padding:14px 6px;cursor:pointer}
.energy button b{font-size:14px}.energy button span{font-size:12px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,rgba(14,19,48,0),rgba(14,19,48,.95) 30%)}
nav .in{display:flex;gap:4px;max-width:460px;width:100%;background:rgba(23,29,69,.92);border:1.5px solid var(--line);border-radius:22px;padding:6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;border:none;background:none;color:var(--dim);font-family:Manrope,sans-serif;font-size:11px;font-weight:700;border-radius:16px;cursor:pointer}
nav button.on{background:rgba(255,214,107,.14);color:var(--gold)}
.gear{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 16px);width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.boss{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(58,20,52,.85),rgba(23,29,69,.75));border:1.5px solid rgba(255,111,122,.35);border-radius:20px;padding:12px 16px 12px 8px}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border-radius:16px;padding:10px 4px;background:rgba(20,26,61,.65);font-size:11px;font-weight:700;color:var(--dim)}
.medal.got{background:rgba(255,214,107,.12);color:var(--pale)}
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;background:radial-gradient(circle at 50% 38%,rgba(255,214,107,.5),rgba(14,19,48,0) 60%),#0E1330;animation:fadein .4s ease-out}
.overlay .rays{position:absolute;left:0;top:-60px;width:320px;height:320px;animation:spin 14s linear infinite;pointer-events:none}
.overlay>*:not(.rays){position:relative}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:30;background:rgba(23,29,69,.95);border:1.5px solid var(--gold);border-radius:14px;padding:12px 16px;font-weight:700;max-width:90%;animation:rise .4s ease-out}
.flystar{position:fixed;left:0;top:0;z-index:25;width:26px;height:26px;pointer-events:none;filter:drop-shadow(0 0 6px #FFD66B)}
.small{font-size:13px}
.link{background:none;border:none;color:var(--gold);font-family:Manrope,sans-serif;font-size:14px;font-weight:700;cursor:pointer;padding:8px;min-height:44px}
.range{width:100%;accent-color:#FFD66B}
.list{display:flex;flex-direction:column;gap:6px}
.list div{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid rgba(185,180,255,.15)}
body.less *{animation:none!important;transition:none!important}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes poof{0%{transform:scale(1);opacity:1}100%{transform:scale(2.2);opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(30px) scale(.7);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes raysSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.float{animation:floaty 4s ease-in-out infinite}
.sunrays{transform-origin:50% 50%;transform-box:fill-box;animation:raysSpin 60s linear infinite}
</style>
</head>
